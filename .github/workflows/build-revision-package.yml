name: Build revision submission package

on:
  push:
    branches:
      - funsd-external-validation
    paths:
      - '.github/workflows/build-revision-package.yml'
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/cover_letter.tex'
      - 'paper/revision_cover_letter.tex'
      - 'paper/response_to_reviewers.tex'
      - 'paper/graphical_abstract.tex'
      - 'paper/figure_captions_and_alt_text.txt'
      - 'paper/highlights.txt'
      - 'paper/*.sty'
      - 'paper/*.cls'
      - 'paper/*.bst'
      - 'paper/figures/**'
      - 'paper/images/**'
  workflow_dispatch:

concurrency:
  group: build-revision-submission-package
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout revision branch with history
        uses: actions/checkout@v4
        with:
          ref: funsd-external-validation
          fetch-depth: 0

      - name: Install LaTeX, latexdiff and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexdiff latexmk \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-science texlive-pictures texlive-fonts-recommended \
            texlive-bibtex-extra poppler-utils zip

      - name: Recover submitted baseline manuscript
        run: |
          set -euxo pipefail
          git fetch origin main
          git show origin/main:paper/main.tex > paper/.article_v1_0_submitted_baseline.tex
          test -s paper/.article_v1_0_submitted_baseline.tex

      - name: Generate red-blue tracked manuscript
        working-directory: paper
        run: |
          set -euxo pipefail
          # main.tex is self-contained, so avoiding --flatten removes a known
          # source of path-resolution failures while preserving latexdiff semantics.
          latexdiff --type=CFONT \
            .article_v1_0_submitted_baseline.tex main.tex \
            > article_v1_0_red_blue_changes.tex
          test -s article_v1_0_red_blue_changes.tex
          grep -q '\\DIFadd' article_v1_0_red_blue_changes.tex
          grep -q '\\DIFdel' article_v1_0_red_blue_changes.tex

      - name: Generate blue-only tracked manuscript
        working-directory: paper
        run: |
          set -euxo pipefail
          cp article_v1_0_red_blue_changes.tex article_v1_0_blue_changes.tex
          python - <<'PY'
          from pathlib import Path

          p = Path('article_v1_0_blue_changes.tex')
          s = p.read_text(encoding='utf-8')
          marker = r'\begin{document}'
          override = r'''
% Blue-only revision view: additions remain blue; submitted deletions are hidden.
\makeatletter
\providecommand{\DIFdel}[1]{}
\providecommand{\DIFdelbegin}{}
\providecommand{\DIFdelend}{}
\providecommand{\DIFmodbegin}{}
\providecommand{\DIFmodend}{}
\renewcommand{\DIFdel}[1]{}
\renewcommand{\DIFdelbegin}{}
\renewcommand{\DIFdelend}{}
\renewcommand{\DIFmodbegin}{}
\renewcommand{\DIFmodend}{}
\makeatother
'''
          if marker not in s:
              raise SystemExit(r'Could not locate \begin{document} in latexdiff output')
          s = s.replace(marker, override + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          test -s article_v1_0_blue_changes.tex

      - name: Compile clean and tracked manuscripts
        working-directory: paper
        run: |
          set -euxo pipefail
          compile_tex () {
            f="$1"
            latexmk -pdf -interaction=nonstopmode -halt-on-error "$f"
          }

          compile_tex main.tex
          cp main.pdf article_v1_0_clean.pdf

          compile_tex article_v1_0_blue_changes.tex
          cp article_v1_0_blue_changes.pdf article_v1_0_blue_changes_updated.pdf

          compile_tex article_v1_0_red_blue_changes.tex
          cp article_v1_0_red_blue_changes.pdf article_v1_0_red_blue_changes_updated.pdf

      - name: Compile revision correspondence and graphical abstract
        working-directory: paper
        run: |
          set -euxo pipefail
          for f in cover_letter.tex revision_cover_letter.tex response_to_reviewers.tex; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error "$f"
          done
          if [ -f graphical_abstract.tex ]; then
            latexmk -pdf -interaction=nonstopmode -halt-on-error graphical_abstract.tex
          fi

      - name: PDF preflight
        working-directory: paper
        run: |
          set -euxo pipefail
          files=(
            main.pdf
            article_v1_0_clean.pdf
            article_v1_0_blue_changes_updated.pdf
            article_v1_0_red_blue_changes.pdf
            article_v1_0_red_blue_changes_updated.pdf
            cover_letter.pdf
            revision_cover_letter.pdf
            response_to_reviewers.pdf
          )
          if [ -f graphical_abstract.pdf ]; then files+=(graphical_abstract.pdf); fi

          : > build_warnings.txt
          for f in "${files[@]}"; do
            test -s "$f"
            pdfinfo "$f" | grep -E '^(Pages|Page size):' | tee -a build_warnings.txt
          done

          # Undefined citations/references are hard failures.
          if grep -R -nE 'LaTeX Warning:.*undefined|Citation .* undefined|Reference .* undefined|There were undefined references' -- *.log; then
            echo 'Undefined citations or references found.' >&2
            exit 1
          fi

          # Overfull boxes are recorded for the mandatory visual audit, but do
          # not suppress otherwise valid PDFs before we can inspect them.
          grep -R -n 'Overfull \\hbox' -- *.log | tee -a build_warnings.txt || true

      - name: Rebuild revised LaTeX source ZIP
        working-directory: paper
        run: |
          set -euxo pipefail
          rm -f latex_source_v1_0_revised.zip
          rm -f .article_v1_0_submitted_baseline.tex
          zip -r latex_source_v1_0_revised.zip . \
            -x '*.aux' '*.log' '*.out' '*.fls' '*.fdb_latexmk' '*.synctex.gz' \
               '*.toc' '*.lof' '*.lot' 'build_warnings.txt' \
               'latex_source_v1_0_revised.zip' \
               'article_v1_0_clean.pdf' 'article_v1_0_blue_changes.pdf' \
               'article_v1_0_blue_changes_updated.pdf' \
               'article_v1_0_red_blue_changes.pdf' \
               'article_v1_0_red_blue_changes_updated.pdf' \
               'main.pdf' 'cover_letter.pdf' 'revision_cover_letter.pdf' \
               'response_to_reviewers.pdf' 'graphical_abstract.pdf'
          test -s latex_source_v1_0_revised.zip

      - name: Commit regenerated submission artifacts
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            paper/article_v1_0_blue_changes.tex \
            paper/article_v1_0_red_blue_changes.tex \
            paper/article_v1_0_clean.pdf \
            paper/article_v1_0_blue_changes_updated.pdf \
            paper/article_v1_0_red_blue_changes.pdf \
            paper/article_v1_0_red_blue_changes_updated.pdf \
            paper/main.pdf \
            paper/cover_letter.pdf \
            paper/revision_cover_letter.pdf \
            paper/response_to_reviewers.pdf \
            paper/latex_source_v1_0_revised.zip
          if [ -f paper/graphical_abstract.pdf ]; then git add paper/graphical_abstract.pdf; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate tracked-change sources and submission PDFs [skip ci]'
          git push origin HEAD:funsd-external-validation

      - name: Upload submission package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: revision-submission-package
          retention-days: 30
          if-no-files-found: error
          path: |
            paper/main.pdf
            paper/article_v1_0_clean.pdf
            paper/article_v1_0_blue_changes_updated.pdf
            paper/article_v1_0_red_blue_changes.pdf
            paper/article_v1_0_red_blue_changes_updated.pdf
            paper/cover_letter.pdf
            paper/revision_cover_letter.pdf
            paper/response_to_reviewers.pdf
            paper/graphical_abstract.pdf
            paper/article_v1_0_blue_changes.tex
            paper/article_v1_0_red_blue_changes.tex
            paper/latex_source_v1_0_revised.zip
            paper/highlights.txt
            paper/figure_captions_and_alt_text.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: revision-build-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            paper/*.log
            paper/article_v1_0_blue_changes.tex
            paper/article_v1_0_red_blue_changes.tex
            paper/build_warnings.txt
